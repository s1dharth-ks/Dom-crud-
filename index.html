<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<main>
  <h1>Student Task Manager</h1>
  <p class="sub">Assign, track and update tasks for your students.</p>

  <section>
    <h2 id="formTitle">Add a task</h2>
    <form id="taskForm" novalidate>
      <label>Task ID
        <input type="text" id="taskId" name="taskId" placeholder="T001">
        <span class="err" id="idErr"></span>
      </label>
      <label>Task name
        <input type="text" id="taskName" name="taskName" placeholder="JavaScript DOM Practice">
        <span class="err" id="nameErr"></span>
      </label>
      <label>Student name
        <input type="text" id="studentName" name="studentName" placeholder="Rahul">
        <span class="err" id="studentErr"></span>
      </label>
      <label>Assigned date
        <input type="date" id="assignedDate">
        <span class="err" id="assignedErr"></span>
      </label>
      <label>Deadline
        <input type="date" id="deadline">
        <span class="err" id="deadlineErr"></span>
      </label>
      <label>Status
        <select id="status">
          <option>Pending</option>
          <option>Completed</option>
        </select>
      </label>
      <div class="actions">
        <button type="submit" id="submitBtn">Add Task</button>
        <button type="button" class="secondary" id="cancelEditBtn" style="display:none">Cancel edit</button>
      </div>
    </form>
  </section>


  <section>
    <div class="tools">
      <input type="search" id="search" placeholder="Search by student or task name" aria-label="Search tasks">
      <select id="filterStatus" aria-label="Filter by status">
        <option value="All">All statuses</option>
        <option>Pending</option>
        <option>Completed</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Task</th><th>Student</th><th>Assigned</th><th>Deadline</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true">
  <div class="dialog">
    <p>Are you sure you want to delete this task?</p>
    <div>
      <button class="secondary" id="cancelDelete">Cancel</button>
      <button class="danger" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>
</body>
</html>
